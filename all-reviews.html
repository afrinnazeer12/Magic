<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Reviews - Magic Delightz</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; list-style:none; text-decoration:none; }
        body { font-family:'Poppins',sans-serif; background:#fdf6ee; min-height:100vh; display:flex; flex-direction:column; }
        /* Top Bar */
        .top-bar { background:#1a1a1a; padding:16px 6%; display:flex; align-items:center; justify-content:space-between; }
        .top-logo { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; color:#fff; }
        .top-logo span { color:#ff9f0d; }
        .back-btn { display:flex; align-items:center; gap:6px; color:#ff9f0d; font-size:0.9rem; font-weight:500; transition:gap .2s; }
        .back-btn:hover { gap:10px; }
        /* Hero */
        .page-hero { background:linear-gradient(135deg,#1a1a1a,#2d2d2d); text-align:center; padding:56px 6% 44px; }
        .page-hero .label { color:#ff9f0d; font-size:0.82rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
        .page-hero h1 { font-family:'Playfair Display',serif; color:#fff; font-size:2.4rem; }
        .page-hero h1 span { color:#ff9f0d; }
        .page-hero p { color:#aaa; font-size:0.9rem; margin-top:10px; }
        /* Filter Bar */
        .filter-bar { display:flex; justify-content:center; align-items:center; gap:10px; padding:28px 6% 0; flex-wrap:wrap; }
        .filter-btn {
            padding:8px 20px; border-radius:50px; font-family:'Poppins',sans-serif;
            font-size:0.85rem; font-weight:600; cursor:pointer; border:2px solid #f0e8da;
            background:#fff; color:#555; transition:all .25s;
        }
        .filter-btn:hover, .filter-btn.active { background:#ff9f0d; color:#fff; border-color:#ff9f0d; }
        /* Reviews Grid */
        .all-reviews-wrap { padding:36px 6% 60px; flex:1; }
        .reviews-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
            gap:24px;
        }
        /* Card */
        .box {
            background:#fff; border-radius:1rem; padding:26px;
            box-shadow:0 4px 20px rgba(0,0,0,.06); border:1px solid #f0e8da;
            transition:transform .3s, box-shadow .3s; animation:fadeUp .4s ease both;
        }
        .box:hover { transform:translateY(-5px); box-shadow:0 12px 35px rgba(255,159,13,.15); }
        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        .quote-icon { font-size:3rem; color:#ff9f0d; opacity:.35; line-height:1; font-family:Georgia,serif; margin-bottom:6px; }
        .box p { color:#555; font-size:.9rem; line-height:1.7; margin-bottom:18px; }
        .in-box { display:flex; align-items:center; gap:12px; border-top:1px solid #f0e8da; padding-top:14px; }
        .reviewer-avatar { width:40px; height:40px; border-radius:50%; background:#ff9f0d; color:#fff; font-size:.9rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .reviewer-avatar.user-badge { background:#3498db; }
        .bxx-text h4 { font-size:.92rem; font-weight:600; color:#1a1a1a; margin-bottom:2px; }
        .rating i.bx-star { color:#ccc; }
        .rating i { color:#FFD700; font-size:13px; }
        .new-badge { display:inline-block; background:#e8f5e9; color:#27ae60; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:50px; margin-left:6px; vertical-align:middle; }
        /* Delete button */
        .delete-btn {
            display:inline-flex; align-items:center; gap:5px;
            margin-top:12px; padding:6px 14px; border:none; border-radius:50px;
            background:#fff0f0; color:#d63031; font-family:'Poppins',sans-serif;
            font-size:.78rem; font-weight:600; cursor:pointer;
            transition:background .2s, transform .15s;
        }
        .delete-btn:hover { background:#ffd5d5; transform:scale(1.04); }
        /* Empty state */
        .empty-state { text-align:center; padding:60px 20px; color:#aaa; }
        .empty-state i { font-size:3rem; margin-bottom:14px; display:block; color:#ddd; }
        /* Write Review CTA */
        .cta-strip { background:#1a1a1a; padding:40px 6%; text-align:center; }
        .cta-strip h3 { font-family:'Playfair Display',serif; color:#fff; font-size:1.6rem; margin-bottom:14px; }
        .cta-strip a { display:inline-flex; align-items:center; gap:8px; background:#ff9f0d; color:#fff; padding:13px 30px; border-radius:50px; font-weight:600; font-size:.95rem; transition:transform .2s,box-shadow .2s; }
        .cta-strip a:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(255,159,13,.4); }
        /* Footer */
        .page-footer { background:#1a1a1a; color:#555; text-align:center; padding:18px; font-size:.82rem; border-top:1px solid rgba(255,255,255,.05); }
        @media(max-width:600px){
            .page-hero h1{font-size:1.8rem;}
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="top-logo">&#127874; Magic <span>Delightz</span></div>
    <a href="index.html#review" class="back-btn"><i class='bx bx-arrow-back'></i> Back to Home</a>
</div>
<div class="page-hero">
    <p class="label">&#11088; All Testimonials</p>
    <h1>Every <span>Sweet</span> Story</h1>
    <p id="totalCount">Loading reviews...</p>
</div>
<div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="5">&#9733; 5</button>
    <button class="filter-btn" data-filter="4">&#9733; 4</button>
    <button class="filter-btn" data-filter="3">&#9733; 3</button>
</div>
<div class="all-reviews-wrap">
    <div class="reviews-grid" id="allGrid"></div>
</div>
<div class="cta-strip">
    <h3>Loved our cakes? Share your experience!</h3>
    <a href="add-review.html"><i class='bx bx-edit'></i> Write a Review</a>
</div>
<div class="page-footer">&copy; 2024 Magic Delightz &mdash; Made with &#127874; &amp; love</div>
<script>
const STORAGE_KEY = "magicDelightz_reviews";
const STATIC_REVIEWS = [];
function starHTML(rating) {
    return '<i class="bx bxs-star"></i>'.repeat(rating) + '<i class="bx bx-star"></i>'.repeat(5 - rating);
}
function buildCard(r, index) {
    const avatarClass = r.isUser ? "reviewer-avatar user-badge" : "reviewer-avatar";
    const badge = r.isUser ? '<span class="new-badge">New</span>' : '';
    const deleteBtn = r.isUser
        ? `<button class="delete-btn" onclick="deleteReview(${r.storageIndex})"><i class='bx bx-trash'></i> Delete</button>`
        : '';
    const card = document.createElement("div");
    card.className = "box";
    card.dataset.rating = r.rating;
    card.style.animationDelay = (index * 0.05) + "s";
    card.innerHTML = `
        <div class="quote-icon">"</div>
        <p>${r.comment}</p>
        <div class="in-box">
            <div class="${avatarClass}">${r.name.charAt(0).toUpperCase()}</div>
            <div class="bxx-text">
                <h4>${r.name}${badge}</h4>
                <div class="rating">${starHTML(r.rating)}</div>
            </div>
        </div>
        ${deleteBtn}`;
    return card;
}
function deleteReview(storageIndex) {
    if (!confirm('Are you sure you want to delete this review?')) return;
    const reviews = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    reviews.splice(storageIndex, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
    renderGrid(document.querySelector('.filter-btn.active').dataset.filter);
}
function renderGrid(filter) {
    const grid = document.getElementById("allGrid");
    grid.innerHTML = "";
    const rawReviews = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const userReviews = rawReviews
        .map((r, i) => ({...r, isUser:true, storageIndex:i}))
        .reverse();
    const all = [...STATIC_REVIEWS, ...userReviews];
    document.getElementById("totalCount").textContent =
        all.length + " review" + (all.length !== 1 ? "s" : "");
    const filtered = filter === "all" ? all : all.filter(r => r.rating === parseInt(filter));
    if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class='bx bxs-star'></i>No ${filter}-star reviews yet.</div>`;
        return;
    }
    filtered.forEach((r, i) => grid.appendChild(buildCard(r, i)));
}
// Filter buttons
document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        renderGrid(this.dataset.filter);
    });
});
renderGrid("all");
</script>
</body>
</html>
